name: CI - Data Processor

on:
  pull_request:
    branches: [master]
    paths:
      - src/services/WeakAppWrapper.Processor/**
      - src/shared/**
      - WeakAppWrapper.slnx
      - tests/WeakAppWrapper.Processor.Tests/**
      - Directory.Build.props
      - Directory.Packages.props
      - .editorconfig
      - .github/workflows/data-processor.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, format, test, and image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/WeakAppWrapper.Processor.Tests/WeakAppWrapper.Processor.Tests.csproj

      - name: Format check
        run: dotnet format src/services/WeakAppWrapper.Processor/WeakAppWrapper.Processor.csproj --verify-no-changes --no-restore

      - name: Persistence format check
        run: dotnet format src/shared/WeakAppWrapper.Persistence/WeakAppWrapper.Persistence.csproj --verify-no-changes --no-restore

      - name: Test format check
        run: dotnet format tests/WeakAppWrapper.Processor.Tests/WeakAppWrapper.Processor.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build src/services/WeakAppWrapper.Processor/WeakAppWrapper.Processor.csproj --configuration Release --no-restore

      - name: Build processor tests
        run: dotnet build tests/WeakAppWrapper.Processor.Tests/WeakAppWrapper.Processor.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/WeakAppWrapper.Processor.Tests/WeakAppWrapper.Processor.Tests.csproj --configuration Release --no-build --no-restore
